<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Applications</title>
<style>
  :root{
    --bg:#f7f6f2;
    --card:#ffffff;
    --border:#e5e3dc;
    --text:#1f1e1c;
    --muted:#6b6a64;
    --accent:#2f6fed;
    --danger:#c94b4b;
    --sent-bg:#eaf1ff;
    --sent-text:#2f6fed;
    --wait-bg:#fff4e0;
    --wait-text:#a86a00;
    --int-bg:#e9f8ee;
    --int-text:#1f8a4c;
    --off-bg:#f3eaff;
    --off-text:#7a3fd6;
    --rej-bg:#fbeaea;
    --rej-text:#c94b4b;
  }
  *{box-sizing:border-box;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    margin:0;
    padding:28px 14px;
  }
  .wrap{max-width:1020px;margin:0 auto;}
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  button.add{
    background:var(--text);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  button.add.ghost{
    background:none;
    color:var(--muted);
    border:1px solid var(--border);
  }
  .stats{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:10px;
    margin-bottom:18px;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat .label{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em;}
  .stat .value{font-size:22px;font-weight:700;line-height:1;}
  .table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
  }
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-weight:600;
    color:var(--muted);
    font-size:12px;
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    background:var(--card);
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  tbody tr{border-bottom:1px solid var(--border);transition:background 0.15s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#fcfbfa;}
  td{padding:10px 12px;vertical-align:top;}
  td.num{color:var(--muted);width:28px;font-size:12px;}
  td.company{font-weight:600;min-width:170px;font-size:13.5px;}
  td.position{min-width:180px;line-height:1.35;}
  td.date{min-width:132px;}
  td.notes{color:var(--muted);max-width:220px;line-height:1.35;font-size:12.5px;}
  td.action{width:32px;text-align:center;}

  [contenteditable="true"]{
    outline:none;
    border-radius:6px;
    padding:2px 5px;
    margin:-2px -5px;
    display:inline-block;
    min-width:10px;
  }
  [contenteditable="true"]:hover{background:#f1f0ec;}
  [contenteditable="true"]:focus{background:#fff;box-shadow:0 0 0 2px var(--accent);}

  /* Date + days ago - CLEAN VERSION */
  .date-wrap{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .date-main{
    font-weight:500;
    color:var(--text);
    font-size:13px;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
  }
  .date-main.empty{color:var(--muted);font-weight:400;}
  .days-ago{
    font-size:11px;
    line-height:1.2;
    font-weight:500;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .days-ago::before{
    content:"";
    width:3px;
    height:3px;
    border-radius:50%;
    background:currentColor;
    opacity:0.5;
    display:inline-block;
  }
  .days-ago.is-today{color:var(--int-text);}
  .days-ago.is-today::before{opacity:1;background:var(--int-text);}
  .days-ago.is-old{color:var(--wait-text);}
  .days-ago.is-very-old{color:var(--rej-text);}
  .days-ago.is-future{color:var(--sent-text);}

  select.status{
    font-size:12px;
    font-weight:600;
    border-radius:999px;
    padding:5px 10px;
    border:none;
    cursor:pointer;
    appearance:none;
    line-height:1;
  }
  select.status.Sent{background-color:var(--sent-bg);color:var(--sent-text);}
  select.status.Waiting{background-color:var(--wait-bg);color:var(--wait-text);}
  select.status.Interview{background-color:var(--int-bg);color:var(--int-text);}
  select.status.Offer{background-color:var(--off-bg);color:var(--off-text);}
  select.status.Rejected{background-color:var(--rej-bg);color:var(--rej-text);}

  .del-btn{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--muted);
    font-size:14px;
    padding:4px 6px;
    border-radius:6px;
  }
  .del-btn:hover{background:#f1f0ec;color:var(--danger);}

  tr.rejected td.company,
  tr.rejected td.position{color:var(--muted);}
  tr.rejected .scratch-wrap{position:relative;display:inline-block;}
  tr.rejected .scratch-wrap::before,
  tr.rejected .scratch-wrap::after{
    content:"";
    position:absolute;
    left:-3%;
    width:106%;
    height:1.5px;
    background:var(--danger);
    top:50%;
  }
  tr.rejected .scratch-wrap::before{transform:translateY(-50%) rotate(-2.5deg);}
  tr.rejected .scratch-wrap::after{transform:translateY(-50%) rotate(1.5deg);top:55%;}
  tr.rejected td.date,
  tr.rejected td.notes{opacity:0.6;}
  tr.rejected{background:#fdfaf9;}

  .footnote{font-size:11px;color:var(--muted);margin-top:12px;text-align:center;}
  @media(max-width:720px){
    .stats{grid-template-columns:repeat(3,1fr);}
    body{padding:16px 10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Job applications</h1>
    <div style="display:flex;gap:8px;">
      <button class="add ghost" onclick="resetData()">Reset</button>
      <button class="add" onclick="addRow()">+ Add application</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">Total</div><div class="value" id="stat-total">0</div></div>
    <div class="stat"><div class="label">Sent</div><div class="value" id="stat-sent">0</div></div>
    <div class="stat"><div class="label">Interview</div><div class="value" id="stat-interview">0</div></div>
    <div class="stat"><div class="label">Offer</div><div class="value" id="stat-offer">0</div></div>
    <div class="stat"><div class="label">Rejected</div><div class="value" id="stat-rejected">0</div></div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Company</th>
          <th>Position</th>
          <th>Date sent</th>
          <th>Status</th>
          <th>Notes</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="footnote">Click any cell to edit · days ago auto-calculates from today · replaces old file to keep your 12 jobs</div>
</div>

<script>
const STATUSES = ["Sent","Waiting","Interview","Offer","Rejected"];
const STORAGE_KEY = "job-tracker-data";

// FULL 12 DATA FROM YOUR SCREENSHOT
const defaultData = [
  {company:"PT SEZ Gama Cendekia", position:"Perencana Kawasan", date:"2026-06-08", status:"Rejected", notes:"Via email - hrptsgc@gm..."},
  {company:"GISACT", position:"Geospatial Data Engineer", date:"2026-06-14", status:"Rejected", notes:"Via gisact.io/careers - C..."},
  {company:"TruCarbon", position:"GIS Specialist", date:"2026-06-15", status:"Rejected", notes:"WA reply: will contact if ..."},
  {company:"ATR/BPN (World Bank ILASPP)", position:"Spatial Data Monitoring Officer", date:"2026-06-22", status:"Rejected", notes:"EOI via reoiilapps.atrbp..."},
  {company:"Pertamina Hulu Rokan", position:"Intern Supply Chain Management", date:"", status:"Rejected", notes:"Portal profile in progres..."},
  {company:"PT Amara Cisadane (AMC)", position:"Staf Teknis Bidang Peta", date:"2026-07-03", status:"Sent", notes:"Via email - hrd@amaraci..."},
  {company:"Haldin Natural", position:"GIS Operator & Admin", date:"2026-07-09", status:"Sent", notes:"Via email - career@haldi..."},
  {company:"Pertamina Digital Hub", position:"Digital Technical Intern", date:"2026-07-04", status:"Sent", notes:"Via company site"},
  {company:"Daemeter", position:"GIS & Remote Sensing Specialist", date:"2026-07-11", status:"Sent", notes:"Via company site/form"},
  {company:"CarbonEthics", position:"Gis Specialist", date:"2026-07-13", status:"Sent", notes:"Via company google form"},
  {company:"Mineral Alam Abadi", position:"Land Acquisition Foreman", date:"2026-07-14", status:"Sent", notes:"Via company site/respond sent via email"},
  {company:"Mineral Alam Abadi", position:"Land & GIS Database Foreman", date:"2026-07-14", status:"Sent", notes:"Via company site/respond sent via email"}
];

function loadData(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      const parsed = JSON.parse(saved);
      if(Array.isArray(parsed) && parsed.length>0) return parsed;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(defaultData));
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){} }
function getTodayString(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }

function getDaysAgoInfo(dateStr){
  if(!dateStr) return null;
  const s=dateStr.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d]=s.split('-').map(Number);
  const sent=new Date(y,m-1,d);
  if(isNaN(sent)) return null;
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const sentMid=new Date(sent.getFullYear(),sent.getMonth(),sent.getDate());
  const diff=Math.floor((today-sentMid)/86400000);
  if(diff<0) return {text:`in ${Math.abs(diff)}d`, type:'future'};
  if(diff===0) return {text:'today', type:'today'};
  if(diff===1) return {text:'1 day ago', type:'recent'};
  return {text:`${diff} days ago`, type: diff>21?'very-old': diff>10?'old':'recent', days:diff};
}

let data=loadData();
const tbody=document.getElementById('tbody');

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  tbody.innerHTML="";
  data.forEach((row,i)=>{
    const tr=document.createElement('tr');
    if(row.status==="Rejected") tr.classList.add('rejected');
    const dInfo=getDaysAgoInfo(row.date);
    const daysHtml=dInfo?`<span class="days-ago is-${dInfo.type}">${dInfo.text}</span>`:'';
    const dateText=row.date||'—';
    const emptyCls=row.date?'':' empty';
    tr.innerHTML=`
      <td class="num">${i+1}</td>
      <td class="company"><span class="scratch-wrap"><span contenteditable="true" data-field="company" data-i="${i}">${esc(row.company)}</span></span></td>
      <td class="position"><span class="scratch-wrap"><span contenteditable="true" data-field="position" data-i="${i}">${esc(row.position)}</span></span></td>
      <td class="date"><div class="date-wrap"><span class="date-main${emptyCls}" contenteditable="true" data-field="date" data-i="${i}">${esc(dateText)}</span>${daysHtml}</div></td>
      <td><select class="status ${row.status}" data-i="${i}">${STATUSES.map(s=>`<option value="${s}" ${s===row.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td class="notes"><span contenteditable="true" data-field="notes" data-i="${i}">${esc(row.notes)}</span></td>
      <td class="action"><button class="del-btn" data-i="${i}">✕</button></td>`;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[contenteditable="true"]').forEach(el=>{
    el.addEventListener('blur',()=>{
      const i=+el.dataset.i; const f=el.dataset.field; let v=el.textContent.trim(); if(v==='—') v=''; data[i][f]=v; saveData(); if(f==='date') render();
    });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); }});
  });
  tbody.querySelectorAll('select.status').forEach(sel=>{
    sel.addEventListener('change',()=>{ data[+sel.dataset.i].status=sel.value; saveData(); render(); });
  });
  tbody.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ data.splice(+btn.dataset.i,1); saveData(); render(); });
  });
  updateStats();
}
function updateStats(){
  document.getElementById('stat-total').textContent=data.length;
  document.getElementById('stat-sent').textContent=data.filter(r=>r.status==='Sent').length;
  document.getElementById('stat-interview').textContent=data.filter(r=>r.status==='Interview').length;
  document.getElementById('stat-offer').textContent=data.filter(r=>r.status==='Offer').length;
  document.getElementById('stat-rejected').textContent=data.filter(r=>r.status==='Rejected').length;
}
function addRow(){ data.push({company:"New company",position:"Position",date:getTodayString(),status:"Sent",notes:""}); saveData(); render(); }
function resetData(){ if(confirm("Reset to 12 jobs? This clears localStorage.")){ data=JSON.parse(JSON.stringify(defaultData)); saveData(); render(); } }
render();
</script>
</body>
</html>
