<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Job Applications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4f6f8;--ink:#10243e;--muted:#5a6878;--line:#d5dce4;--rule:#aab6c4;
  --sent:#1f4e8c;--waiting:#8f5c06;--interview:#0f7a5a;--offer:#8a2f78;--rejected:#b83a2e;
  --sans:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0f1722;--ink:#e8edf4;--muted:#93a0b2;--line:#243142;--rule:#3d4e64;
  --sent:#7ea6e8;--waiting:#e2a84a;--interview:#4cc9a0;--offer:#d680c4;--rejected:#f0796b;
}}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{font:400 15px/1.45 var(--sans);background:var(--ground);color:var(--ink);margin:0;padding:56px 28px 90px;}
.wrap{max-width:1120px;margin:0 auto;}

.header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:30px;}
h1{font:800 clamp(44px,9.5vw,104px)/.9 var(--sans);letter-spacing:-.045em;margin:0;text-wrap:balance;}
.summary{display:flex;align-items:center;justify-content:center;gap:20px;width:100%;margin:22px 0 0;font-size:17px;color:var(--muted);}
.summary::before,.summary::after{content:"";flex:1;min-width:16px;border-top:1.5px dotted var(--rule);}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:24px;}
.btn{font:600 14px/1 var(--sans);border-radius:4px;padding:12px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--ground);transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule);}
.btn.quiet:hover{opacity:1;border-color:var(--ink);}
.btn.quiet:disabled{color:var(--muted);opacity:.5;cursor:default;}
.btn:focus-visible,.chip:focus-visible,.del:focus-visible,select.status:focus-visible,
.file-open:focus-visible,.file-del:focus-visible,.attach:focus-visible{outline:2px solid var(--sent);outline-offset:3px;}

.st-Sent{--c:var(--sent);} .st-Waiting{--c:var(--waiting);} .st-Interview{--c:var(--interview);}
.st-Offer{--c:var(--offer);} .st-Rejected{--c:var(--rejected);}

/* Pipeline bar + legend. The legend markers are the same shapes the lines below end in. */
.pipeline{margin-bottom:30px;}
.bar{height:10px;overflow:hidden;background:var(--line);}
.bar-inner{display:flex;width:calc(100% + 4px);height:100%;}
.seg{flex:0 1 0;min-width:0;background:var(--c);box-shadow:inset -4px 0 0 var(--ground);transition:flex-grow .5s ease;}
.key{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px;margin:16px 0 0;padding:0;list-style:none;}
.chip{display:inline-flex;align-items:center;gap:9px;font:500 15px/1.2 var(--sans);padding:4px 0 5px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink);cursor:pointer;}
.chip:hover,.chip[aria-pressed="true"]{border-bottom-color:var(--c);}
.chip b{font-weight:600;font-variant-numeric:tabular-nums;}
.end,.chip::before{content:"";flex:none;width:12px;height:12px;background:var(--c);border-radius:50%;}
.st-Waiting .end,.chip.st-Waiting::before{background:var(--ground);border:2.5px solid var(--c);}
.st-Interview .end,.chip.st-Interview::before{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent);}
.st-Offer .end,.chip.st-Offer::before{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);width:15px;height:15px;}
.st-Rejected .end,.chip.st-Rejected::before{border-radius:0;width:13px;height:13px;clip-path:polygon(20% 0,50% 30%,80% 0,100% 20%,70% 50%,100% 80%,80% 100%,50% 70%,20% 100%,0 80%,30% 50%,0 20%);}

/* Rows */
.list{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink);}
.row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.9fr) 118px 24px;
  grid-template-areas:"main line stage del" "notes files files files";gap:10px 30px;align-items:center;padding:22px 0;border-top:1px solid var(--line);}
.row:first-child{border-top:0;}
.visitor .row{grid-template-columns:minmax(0,1.05fr) minmax(0,1.9fr) 110px;grid-template-areas:"main line stage";}
.none{padding:30px 0;color:var(--muted);}
.main{grid-area:main;display:flex;flex-direction:column;gap:4px;min-width:0;}
.co{font:600 19px/1.2 var(--sans);letter-spacing:-.01em;}
.po{color:var(--muted);}
.stage{grid-area:stage;}
.notes{grid-area:notes;align-self:start;color:var(--muted);font-size:14px;}
.files{grid-area:files;align-self:start;}
.del{grid-area:del;}

/* The line: drawn from the day it was sent to today */
.line{grid-area:line;display:flex;align-items:center;gap:14px;min-width:0;}
.when{flex:none;width:6.4rem;white-space:nowrap;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ago{flex:none;width:4.6rem;text-align:right;font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;}
.ago.slow{color:var(--waiting);} .ago.late{color:var(--rejected);font-weight:600;}
.track{position:relative;flex:1;height:20px;margin-right:8px;}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dotted var(--rule);}
.run{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--c);}
.end{position:absolute;top:50%;transform:translate(-50%,-50%);}
.rejected .run{background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 10px);opacity:.6;}
.rejected .co,.rejected .po{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rejected);text-decoration-thickness:1.5px;}
.rejected .notes{opacity:.65;}

@keyframes draw{from{width:0;}}
@keyframes move{from{left:0;}}
@keyframes rise{from{opacity:0;transform:translateY(18px);}}
.intro .row{animation:rise .65s cubic-bezier(.2,.7,.2,1) calc(var(--n)*90ms) both;}
.intro .run{animation:draw 1.2s cubic-bezier(.2,.7,.2,1) calc(var(--n)*90ms + 350ms) both;}
.intro .end{animation:move 1.2s cubic-bezier(.2,.7,.2,1) calc(var(--n)*90ms + 350ms) both;}

[contenteditable="true"]{outline:none;border-radius:4px;padding:2px 6px;margin:-2px -6px;overflow-wrap:anywhere;transition:background-color .12s;}
[contenteditable="true"]:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);}
[contenteditable="true"]:focus{background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:0 0 0 2px var(--sent);}
[contenteditable="true"]:empty::before{content:attr(data-ph);color:var(--muted);opacity:.65;}

/* Status */
.status-wrap{position:relative;display:inline-flex;align-items:center;}
.status-wrap::after{content:"";position:absolute;right:3px;top:50%;width:5px;height:5px;border-right:1.5px solid var(--c);border-bottom:1.5px solid var(--c);transform:translateY(-70%) rotate(45deg);pointer-events:none;}
select.status{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-bottom:1.5px solid var(--line);border-radius:0;color:var(--c);font:600 14.5px/1.3 var(--sans);padding:3px 20px 3px 0;cursor:pointer;}
select.status:hover{border-bottom-color:var(--c);}
select.status option{color:var(--ink);background:var(--ground);}
.status-text{font:600 14.5px/1.3 var(--sans);color:var(--c);}

/* Files and delete */
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.file{display:inline-flex;align-items:center;max-width:100%;border:1px solid var(--line);border-radius:4px;}
.file-open{font:500 13px/1.2 var(--sans);color:var(--ink);background:none;border:0;padding:6px 4px 6px 10px;cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;}
.file-open:hover{color:var(--sent);text-decoration:underline;}
.file-del{background:none;border:0;color:var(--muted);font-size:12px;line-height:1;padding:6px 9px 6px 4px;cursor:pointer;opacity:.6;}
.file-del:hover{color:var(--rejected);opacity:1;}
.attach{font:600 12.5px/1 var(--sans);color:var(--muted);background:transparent;border:1px dashed var(--rule);border-radius:4px;padding:7px 11px;cursor:pointer;}
.attach:hover{color:var(--ink);border-color:var(--ink);}
.del{justify-self:end;background:none;border:0;border-radius:4px;color:var(--muted);font-size:16px;line-height:1;padding:6px 8px;margin-right:-8px;cursor:pointer;opacity:.4;transition:opacity .12s,color .12s;}
.row:hover .del,.del:hover,.del:focus-visible{opacity:1;}
.del:hover{color:var(--rejected);}

.visitor .actions,.visitor .sync,.visitor .empty-state .btn{display:none;}
.sync{margin:14px auto 0;font-size:13.5px;color:var(--muted);max-width:60ch;}
.sync.ok{color:var(--interview);} .sync.err{color:var(--rejected);}
.empty-state{border-top:2px solid var(--ink);padding:48px 0 12px;text-align:center;}
.empty-state h2{font:800 36px/1 var(--sans);letter-spacing:-.03em;margin:0 0 12px;}
.empty-state p{margin:0 auto 24px;max-width:46ch;color:var(--muted);}
.footnote{font-size:13px;color:var(--muted);margin:20px auto 0;max-width:70ch;text-align:center;}

@media (max-width:760px){
  body{padding:32px 16px 64px;}
  .row,.visitor .row{grid-template-columns:1fr auto;gap:10px 12px;padding:18px 0;
    grid-template-areas:"main del" "stage stage" "line line" "notes notes" "files files";}
  .visitor .row{grid-template-areas:"main stage" "line line";}
  .del{opacity:.7;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <h1>Job applications</h1>
    <p class="summary" id="summary">Loading…</p>
    <div class="actions">
      <button class="btn" onclick="addRow()">Add application</button>
      <button class="btn quiet" id="sync-btn" onclick="setupSync()">Site sync</button>
      <button class="btn quiet" id="clear-btn" onclick="clearAll()">Clear all</button>
    </div>
    <p class="sync" id="sync-status"></p>
  </header>

  <section class="pipeline" aria-label="Pipeline">
    <div class="bar" role="img" aria-label="Applications by status">
      <div class="bar-inner">
        <div class="seg st-Sent" id="seg-Sent"></div>
        <div class="seg st-Waiting" id="seg-Waiting"></div>
        <div class="seg st-Interview" id="seg-Interview"></div>
        <div class="seg st-Offer" id="seg-Offer"></div>
        <div class="seg st-Rejected" id="seg-Rejected"></div>
      </div>
    </div>
    <ul class="key">
      <li><button class="chip st-Sent" data-s="Sent" aria-pressed="false">Sent <b id="count-Sent">0</b></button></li>
      <li><button class="chip st-Waiting" data-s="Waiting" aria-pressed="false">Waiting <b id="count-Waiting">0</b></button></li>
      <li><button class="chip st-Interview" data-s="Interview" aria-pressed="false">Interview <b id="count-Interview">0</b></button></li>
      <li><button class="chip st-Offer" data-s="Offer" aria-pressed="false">Offer <b id="count-Offer">0</b></button></li>
      <li><button class="chip st-Rejected" data-s="Rejected" aria-pressed="false">Rejected <b id="count-Rejected">0</b></button></li>
    </ul>
  </section>

  <ul class="list" id="list" hidden></ul>

  <div class="empty-state" id="empty">
    <h2>No applications yet</h2>
    <p>Add your first one. Each row keeps the company, the role, the date you sent it and where it stands.</p>
    <button class="btn" onclick="addRow()">Add application</button>
  </div>

  <p class="footnote" id="footnote" hidden></p>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
</div>

<script>
const STATUSES = ["Sent","Waiting","Interview","Offer","Rejected"];
const STAGE = {Sent:1,Waiting:2,Interview:3,Offer:4,Rejected:0};
const STORAGE_KEY = "job-tracker-data";

/* The public list lives in data.json next to this page: company, position, date and status only.
   Notes and PDFs never go there. In the owner view, "Site sync" saves that file to GitHub automatically. */
const REPO = "BobArsa007/JobTracker", FILE = "data.json", BRANCH = "main";
const TOKEN_KEY = "job-tracker-token";

/* Owner view (editable, PDFs) is switched on per browser by opening the page once with ?owner on the end;
   ?owner=off switches it off again. Everyone else gets the read-only public list. */
const OWNER_KEY = "job-tracker-owner";
function resolveOwner(){
  try{
    const p = new URLSearchParams(location.search);
    if(p.has("owner")){
      if(p.get("owner")==="off") localStorage.removeItem(OWNER_KEY); else localStorage.setItem(OWNER_KEY,"1");
      history.replaceState(null,"",location.pathname+location.hash);
    }
    return localStorage.getItem(OWNER_KEY)==="1";
  }catch(e){ return false; }
}
const isOwner = resolveOwner();
if(!isOwner) document.body.classList.add('visitor');

let data=[], loaded=false, loadFailed=false, filter=null;
const list=document.getElementById('list');

async function fetchPublic(){
  try{
    const r = await fetch(FILE+"?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) return null;
    const j = await r.json();
    if(!Array.isArray(j)) return null;
    return j.map(x=>({
      company:String((x&&x.company)||""), position:String((x&&x.position)||""), date:String((x&&x.date)||""),
      status:STATUSES.includes(x&&x.status)?x.status:"Sent", notes:"", files:[]
    }));
  }catch(e){ return null; }
}

function saveData(){
  if(!isOwner) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  schedulePublish();
}

/* ---- Site sync (owner only): saves the public list to data.json in the GitHub project ---- */
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; } }
function setSync(text,kind){
  const el=document.getElementById('sync-status');
  el.textContent=text; el.className='sync'+(kind?' '+kind:'');
}
function refreshSyncStatus(){
  setSync(getToken()
    ? 'Site sync is on: what you change here is saved to the public list automatically.'
    : 'Site sync is off. Click "Site sync" so your changes show for everyone.');
}
function publicRows(){ return data.map(r=>({company:r.company||"",position:r.position||"",date:r.date||"",status:r.status})); }
function toB64(str){ const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach(b=>{ bin+=String.fromCharCode(b); }); return btoa(bin); }
function fromB64(b64){ const bin=atob(b64.replace(/\s/g,"")); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); }
function apiError(res){
  if(res.status===401) return new Error("the GitHub key was rejected. Click Site sync and paste a new one.");
  if(res.status===403||res.status===404) return new Error("the GitHub key can't write to this project. It needs Contents: Read and write for JobTracker.");
  return new Error("GitHub answered with error "+res.status+".");
}
let publishTimer=null, publishing=false, publishAgain=false;
function schedulePublish(){
  if(!isOwner||!getToken()) return;
  clearTimeout(publishTimer);
  setSync("Changes will be saved to the site in a moment…");
  publishTimer=setTimeout(publish,1500);
}
async function publish(){
  const token=getToken();
  if(!isOwner||!token) return;
  if(publishing){ publishAgain=true; return; }
  publishing=true;
  setSync("Saving to the site…");
  const api=`https://api.github.com/repos/${REPO}/contents/${FILE}`;
  const headers={Authorization:"Bearer "+token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  const body=JSON.stringify(publicRows(),null,2)+"\n";
  const okText="Saved to the site. Visitors see it within a minute or two.";
  try{
    let done=false;
    for(let attempt=0; attempt<3 && !done; attempt++){
      let sha;
      const g=await fetch(`${api}?ref=${BRANCH}&t=${Date.now()}`,{headers,cache:"no-store"});
      if(g.ok){
        const info=await g.json();
        sha=info.sha;
        if(fromB64(info.content||"")===body){ done=true; setSync(okText,"ok"); break; }
      }else if(g.status!==404){ throw apiError(g); }
      const p=await fetch(api,{method:"PUT",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({message:"Update applications",content:toB64(body),sha,branch:BRANCH})});
      if(p.ok){ done=true; setSync(okText,"ok"); }
      else if(p.status===409||p.status===422){ continue; }
      else throw apiError(p);
    }
    if(!done) throw new Error("the site file kept changing. Try again.");
  }catch(e){
    setSync("Could not save to the site: "+(e&&e.message?e.message:"no connection."),"err");
  }finally{
    publishing=false;
    if(publishAgain){ publishAgain=false; schedulePublish(); }
  }
}
function setupSync(){
  if(!isOwner) return;
  const cur=getToken();
  const v=prompt(cur
    ? 'A GitHub key is already saved in this browser. Paste a new one to replace it, or type OFF to turn Site sync off.'
    : 'Paste your GitHub key here. It is kept in this browser only.');
  if(v===null) return;
  const t=v.trim();
  if(!t) return;
  if(t.toUpperCase()==="OFF"){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} refreshSyncStatus(); return; }
  try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){}
  publish();
}

function getTodayString(){ const n=new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; }
function daysSince(s){
  if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.trim())) return null;
  const [y,m,d]=s.trim().split('-').map(Number);
  const sent=new Date(y,m-1,d);
  if(isNaN(sent)) return null;
  const n=new Date();
  return Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-sent)/86400000);
}
function fmtDate(s){
  if(daysSince(s)===null) return s||'—';
  const [y,m,d]=s.trim().split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:y===new Date().getFullYear()?undefined:'numeric'});
}
function summaryText(total){
  const n=`${total} ${total===1?'application':'applications'} tracked.`;
  const w=data.filter(r=>r.status==="Sent"||r.status==="Waiting").map(r=>daysSince(r.date)).filter(x=>x!==null);
  const m=w.length?Math.max(...w):0;
  return m>=1 ? `${n} Longest wait: ${m} ${m===1?'day':'days'}.` : n;
}

/* ---- Attached PDFs: file contents live in IndexedDB, only name/size sit on each row ---- */
const FILE_DB="job-tracker-files", FILE_STORE="files", MAX_FILE_MB=25;
let dbPromise=null;
function openDb(){
  if(dbPromise) return dbPromise;
  dbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB unavailable")); return; }
    const req=indexedDB.open(FILE_DB,1);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(FILE_STORE,{keyPath:"id"}); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  dbPromise.catch(()=>{ dbPromise=null; });
  return dbPromise;
}
function idbRun(mode,fn){
  return openDb().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(FILE_STORE,mode);
    let result;
    const req=fn(tx.objectStore(FILE_STORE));
    if(req) req.onsuccess=()=>{ result=req.result; };
    tx.oncomplete=()=>resolve(result);
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  }));
}
const putFile=rec=>idbRun("readwrite",s=>s.put(rec));
const getFile=id=>idbRun("readonly",s=>s.get(id));
const deleteFiles=ids=>idbRun("readwrite",s=>{ ids.forEach(id=>s.delete(id)); });
const clearFiles=()=>idbRun("readwrite",s=>{ s.clear(); });
function newId(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2); }

let askedPersist=false;
function askPersist(){
  if(askedPersist) return; askedPersist=true;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
}

function openFile(meta){
  // Browsers that can show PDFs get a new tab (opened inside the click so popup blockers allow it); others download it.
  const canView=navigator.pdfViewerEnabled!==false;
  const w=canView?window.open("","_blank"):null;
  getFile(meta.id).then(rec=>{
    if(!rec){ if(w) w.close(); alert("This PDF is no longer stored in this browser. Attach it again to keep a copy here."); return; }
    const url=URL.createObjectURL(rec.blob);
    if(w){ w.location.href=url; }
    else{ const a=document.createElement('a'); a.href=url; a.download=meta.name; document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(()=>URL.revokeObjectURL(url),600000);
  }).catch(()=>{ if(w) w.close(); alert("Couldn't read this PDF from the browser's storage."); });
}

let attachRow=null;
const fileInput=document.getElementById('file-input');
fileInput.addEventListener('change',async()=>{
  const row=attachRow, files=Array.from(fileInput.files);
  fileInput.value=""; attachRow=null;
  if(!row||!files.length) return;
  const problems=[]; let added=0;
  for(const f of files){
    if(!(f.type==="application/pdf"||/\.pdf$/i.test(f.name))){ problems.push(`${f.name}: not a PDF`); continue; }
    if(f.size>MAX_FILE_MB*1024*1024){ problems.push(`${f.name}: larger than ${MAX_FILE_MB} MB`); continue; }
    const id=newId();
    try{
      await putFile({id,name:f.name,size:f.size,added:Date.now(),blob:new Blob([f],{type:"application/pdf"})});
    }catch(e){ problems.push(`${f.name}: couldn't be saved in this browser`); continue; }
    if(!data.includes(row)){ deleteFiles([id]).catch(()=>{}); continue; }
    row.files=(row.files||[]).concat({id,name:f.name,size:f.size});
    added++;
  }
  if(added){ saveData(); render(); askPersist(); }
  if(problems.length) alert("Some files were skipped:\n"+problems.join("\n"));
});

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render(){
  list.innerHTML="";
  const ds=data.map(r=>daysSince(r.date)).filter(x=>x!==null&&x>0);
  const scale=Math.max(14,...ds);
  data.forEach((row,i)=>{
    if(filter && row.status!==filter) return;
    const li=document.createElement('li');
    li.className='row st-'+row.status+(row.status==="Rejected"?' rejected':'');
    li.style.setProperty('--n',Math.min(i,10));
    const d=daysSince(row.date);
    const active=row.status==="Sent"||row.status==="Waiting";
    // Owner view: editable cells, status picker, notes, PDFs, delete. Visitor view: plain text only.
    const ed=(field,label,val,cls,ph)=>isOwner
      ? `<div class="${cls}" contenteditable="true" role="textbox" aria-label="${label}" data-field="${field}" data-i="${i}" data-ph="${ph}">${esc(val)}</div>`
      : `<div class="${cls}">${esc(val)}</div>`;
    const when=isOwner ? ed('date','Date sent',row.date,'when','YYYY-MM-DD') : `<div class="when">${esc(fmtDate(row.date))}</div>`;
    const pct=d===null?0:Math.max(2,Math.min(100,d/scale*100));
    const ago=d===null?'':d<0?`in ${-d}d`:d===0?'today':d===1?'1 day':`${d} days`;
    const agoCls=active&&d>21?' late':active&&d>10?' slow':'';
    const statusCell=isOwner
      ? `<select class="status" aria-label="Status" data-i="${i}">${STATUSES.map(s=>`<option value="${s}" ${s===row.status?'selected':''}>${s}</option>`).join('')}</select>`
      : `<span class="status-text">${esc(row.status)}</span>`;
    const ownerCells=isOwner?`
      ${ed('notes','Notes',row.notes,'notes','Add a note')}
      <div class="files">${(row.files||[]).map(f=>`<span class="file"><button class="file-open" data-i="${i}" data-f="${esc(f.id)}" title="${esc(f.name)}">${esc(f.name)}</button><button class="file-del" data-i="${i}" data-f="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">✕</button></span>`).join('')}<button class="attach" data-i="${i}" aria-label="Attach a PDF to ${esc(row.company)}">+ PDF</button></div>
      <button class="del" aria-label="Delete application" data-i="${i}">✕</button>`:'';
    li.innerHTML=`
      <div class="main">${ed('company','Company',row.company,'co','Company')}${ed('position','Position',row.position,'po','Position')}</div>
      <div class="line">${when}<div class="track" aria-hidden="true"><i class="run" style="width:${pct}%"></i><i class="end" style="left:${pct}%"></i></div><span class="ago${agoCls}">${ago}</span></div>
      <div class="stage"><span class="status-wrap">${statusCell}</span></div>${ownerCells}`;
    list.appendChild(li);
  });
  if(filter && !list.children.length){
    const li=document.createElement('li'); li.className='none'; li.textContent=`No applications with status ${filter}.`; list.appendChild(li);
  }

  list.querySelectorAll('[contenteditable="true"]').forEach(el=>{
    el.addEventListener('blur',()=>{
      const i=+el.dataset.i, f=el.dataset.field;
      data[i][f]=el.textContent.trim(); saveData(); if(f==='date') render();
    });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); }});
  });
  list.querySelectorAll('select.status').forEach(sel=>{
    sel.addEventListener('change',()=>{ data[+sel.dataset.i].status=sel.value; saveData(); render(); });
  });
  list.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.i;
      const ids=(data[i].files||[]).map(f=>f.id);
      if(ids.length && !confirm(`Delete this application and its ${ids.length} attached PDF${ids.length===1?'':'s'}?`)) return;
      data.splice(i,1); saveData(); render();
      if(ids.length) deleteFiles(ids).catch(()=>{});
    });
  });
  list.querySelectorAll('.attach').forEach(btn=>{
    btn.addEventListener('click',()=>{ attachRow=data[+btn.dataset.i]; fileInput.click(); });
  });
  list.querySelectorAll('.file-open').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const meta=(data[+btn.dataset.i].files||[]).find(f=>f.id===btn.dataset.f);
      if(meta) openFile(meta);
    });
  });
  list.querySelectorAll('.file-del').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=data[+btn.dataset.i];
      const meta=(row.files||[]).find(f=>f.id===btn.dataset.f);
      if(!meta||!confirm(`Remove "${meta.name}" from this application?`)) return;
      row.files=row.files.filter(f=>f.id!==meta.id);
      saveData(); render();
      deleteFiles([meta.id]).catch(()=>{});
    });
  });
  updateStats();
}

function updateStats(){
  const total=data.length;
  document.getElementById('summary').textContent = !loaded ? 'Loading…'
    : loadFailed ? "Couldn't load the list. Please try again in a minute."
    : total===0 ? 'Nothing tracked yet'
    : summaryText(total);
  STATUSES.forEach(s=>{
    const n=data.filter(r=>r.status===s).length;
    document.getElementById('count-'+s).textContent=n;
    document.getElementById('seg-'+s).style.flexGrow=n;
  });
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(filter===b.dataset.s)));
  list.hidden = total===0;
  document.getElementById('empty').hidden = total!==0 || !loaded || loadFailed;
  document.getElementById('footnote').hidden = total===0 || !isOwner;
  document.getElementById('clear-btn').disabled = total===0;
}

document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  filter = filter===b.dataset.s ? null : b.dataset.s; render();
}));

function addRow(){ if(!isOwner) return; filter=null; data.push({company:"New company",position:"Position",date:getTodayString(),status:"Sent",notes:"",files:[]}); saveData(); render(); }
function clearAll(){
  if(!isOwner) return;
  if(confirm("Clear all applications? This removes everything saved in this browser, including notes and attached PDFs. If Site sync is on, it also empties the public list.")){
    data=[]; filter=null; saveData(); render();
    clearFiles().catch(()=>{});
  }
}
async function init(){
  if(isOwner){
    let saved=null;
    try{
      const s=localStorage.getItem(STORAGE_KEY);
      if(s){ const p=JSON.parse(s); if(Array.isArray(p)&&p.length>0) saved=p; }
    }catch(e){}
    if(saved) data=saved;
    else{ const pub=await fetchPublic(); data=pub||[]; }
  }else{
    const pub=await fetchPublic();
    if(pub===null) loadFailed=true; else data=pub;
  }
  loaded=true;
  document.body.classList.add('intro');
  render();
  setTimeout(()=>document.body.classList.remove('intro'),3400);
}
if(isOwner){
  document.getElementById('footnote').textContent="Click any cell to edit. Your notes and PDFs stay in this browser and are never published. Visitors see company, position, date and status, which Site sync saves to the site for you.";
  refreshSyncStatus();
}else{
  document.querySelector('#empty p').textContent="Nothing has been added here yet.";
}
render();
init();
</script>
</body>
</html>
